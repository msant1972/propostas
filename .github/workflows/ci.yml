name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:12.3
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: cpq_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
      redis:
        image: redis:8
        ports: ["6379:6379"]
    env:
      TEST_DATABASE_URL: mysql://root:root@127.0.0.1:3306/cpq_test
      TEST_REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @cpq/shared build
      - run: pnpm --filter @cpq/db build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Cliente da API gerado está atualizado
        run: |
          pnpm gen:api
          git diff --exit-code apps/api/openapi.json packages/api-client/src/schema.d.ts
      - run: pnpm audit --audit-level=high

  e2e:
    needs: build-test
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:12.3
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: cpq_dev
        ports: ["3306:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
      redis:
        image: redis:8
        ports: ["6379:6379"]
    env:
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/cpq_dev
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @cpq/shared build
      - run: pnpm --filter @cpq/db build
      - run: pnpm db:migrate && pnpm db:seed
      - run: pnpm --filter @cpq/e2e exec playwright install --with-deps chromium
      - run: pnpm e2e

  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pipx install ansible-lint && ansible-lint
        working-directory: infra/ansible

  sast:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3
