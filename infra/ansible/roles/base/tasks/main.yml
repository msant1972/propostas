- name: Pacotes essenciais (sem o agente)
  ansible.builtin.apt:
    name: [unattended-upgrades, chrony, curl, jq, rsync, ca-certificates, gnupg, ufw, fail2ban, openssl]
    state: present

- name: Atualizações de segurança automáticas
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
    mode: "0644"

- name: Fuso horário UTC
  community.general.timezone:
    name: UTC

# Só acesso por chave (o ansible.cfg já assume SSH por chave); sem login direto do root por palavra-passe.
- name: Endurecer o SSH
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/90-cpq.conf
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin prohibit-password
      MaxAuthTries 3
    mode: "0644"
  notify: restart ssh
